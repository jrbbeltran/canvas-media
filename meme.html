<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <video id="memeVideo" playsinline preload="auto">
        <source src="introvert.webm" type="video/webm">
    </video>

    <script>
        const video = document.getElementById("memeVideo");
        const startTime = 3;

        video.addEventListener("loadedmetadata", function () {
            video.currentTime = startTime;
        });

        video.addEventListener("seeked", function startVideo() {
            video.play();
            video.removeEventListener("seeked", startVideo);
        });

        video.addEventListener("ended", function () {
            video.currentTime = startTime;
            video.play();
        });
    </script>

</body>
</html>
